<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
</head>
<style>
body {
         font-family: Arial, Helvetica, sans-serif;
    }

.subscribe-button {
        border: none;
        background-color: black;
        color: white;
        padding: 10px 15px 10px 15px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        margin-bottom:20px;
    }

    .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
    }

.cost-input{
    font-size: 15px;
    padding:10px;
}
.calculate-button{
    background-color: green; 
    border: none;
    padding: 12px;
    color: white;
    font-size:15px;
    cursor: pointer;
}
</style>

<body>
    <p>YouTube Suscribe Button</p>
    <button onclick="subscribe()" class="js-subscribe-button subscribe-button">Subscribe</button>

    <p>Amazon Shipping calculator</p>
    <input class="js-cost-input cost-input" placeholder="Cost of Orders" onKeydown="handleCostKeyDown(event)">
    <button class="calculate-button" onclick="calculateTotal()">Caluculate</button>
    <p class="js-total-cost"></p>
</body>

<script>
    console.log(window.document)

    function calculateTotal() {
        const inputElement = (document.querySelector('.js-cost-input'));
        let cost = Number(inputElement.value);
        console.log(cost);

        if (cost < 40) {
            cost = cost + 10
        }

        document.querySelector('.js-total-cost').innerHTML = `$${cost}`
    }

    function handleCostKeyDown(event) {
        if (event.key === 'Enter') {
            calculateTotal()
            console.log(event.key)
        }
    }


    // console.log(buttonElement);
    function subscribe() {
        const buttonElement = document.querySelector('.js-subscribe-button')
        if (buttonElement.innerText === 'Subscribe') {
            buttonElement.innerText = 'Subscribed'
            buttonElement.classList.add('is-subscribed')
        } else if (buttonElement.innerText === 'Subscribed') {
            buttonElement.innerText = 'Subscribe'
            buttonElement.classList.remove('is-subscribed');
        };
    }
</script>

</html>
